name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  # Each merge to main has its own group: a group holds one running and one pending run, and a
  # newer run cancels the pending one, so a shared group could leave a merge with no release (#63).
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src/ tests/ tests_windows/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest

  # Known vulnerabilities in the pinned dependency set (#39). pip-audit evaluates the markers for
  # its own interpreter, so each leg audits one slice: Python 3.12 on Linux, Windows and macOS
  # (the platform-only pins; install.ps1 and the macOS installer install 3.12), and Python 3.11 on
  # Linux (the pins marked < '3.12'; install-linux.sh takes any system Python 3.11+). 3.11 is the
  # floor since #64, so every supported slice is audited. There is no ignore list: a finding is
  # fixed by upgrading the pin (pyproject.toml, then the uv command at the top of constraints.txt).
  pip-audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r constraints.txt

  # The bash installers (#12): shellcheck, and the macOS installer tests under bash 3.2 (macOS's
  # /bin/bash, which `curl | bash` runs there: no heredoc in $(...), no mapfile, no
  # globasciiranges). RealMetadata needs a pip-installed pytest (apk's has no INSTALLER file).
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck install-linux.sh install.sh uninstall*.sh scripts/*.sh
      - name: macOS installer tests under bash 3.2
        run: >-
          docker run --rm -v "$PWD":/w:ro bash:3.2 sh -c '
          ln -sf /usr/local/bin/bash /bin/bash && apk add -q python3 py3-pytest && adduser -D -u 1000 t &&
          su t -c "cd /w && INSTALLER_TEST_BASH=/bin/bash python3 -m pytest -q -p no:cacheprovider --noconftest
          -k \"not RealMetadata\" tests/test_installer_macos_key.py tests/test_installer_preflight_rollback.py
          tests/test_installer_python_gate.py tests/test_installer_macos_sudoers.py"'

  # Real Windows PowerShell 5.1, no fakes (#48 round 2): en-US, OEM code page 437 like resolume-pp.
  # Its own directory, which the Linux job never collects (testpaths = tests).
  # cmd, not the default pwsh 7 (review round 2): pwsh puts its own module folders first in
  # PSModulePath, and powershell.exe 5.1 started below python would inherit them and fail to load
  # Microsoft.PowerShell.Utility. The fleet starts the server from cmd too (wscript -> cmd -> python).
  windows-powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - run: pytest tests_windows

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install packaging
      - name: Check PR version is strictly greater than base
        run: |
          git fetch origin ${{ github.base_ref }}
          PR_VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.MULTILINE)
          print(m.group(1))
          ")
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:pyproject.toml | python3 -c "
          import re, sys
          text = sys.stdin.read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.MULTILINE)
          print(m.group(1))
          ")
          echo "PR version:   $PR_VERSION"
          echo "Base version: $BASE_VERSION"
          python3 -c "
          from packaging.version import Version
          pr = Version('$PR_VERSION')
          base = Version('$BASE_VERSION')
          if not (pr > base):
              raise SystemExit(f'FAIL: PR version {pr} is not strictly greater than base version {base}')
          print(f'OK: {pr} > {base}')
          "

  # GitHub release v<version> on every merge to main (#63): its publish date is the age the
  # stable/canary resolver soaks, its `prerelease` mark is the hold switch. Never on a PR or dev.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, pip-audit, shell, windows-powershell]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/create-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
