# TEMPORARY (#114): loops the first UIA walk of a new window on the windows runner. Removed before merge.
name: uia-probe-114
on:
  push:
    branches: [dev]
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e .[test]
      - name: hung window, default client timeouts
        run: for /L %%i in (1,1,2) do python scripts\probe_uia_hung_114.py 0 0
      - name: hung window, transaction 3 s, connection 1 s
        run: for /L %%i in (1,1,2) do python scripts\probe_uia_hung_114.py 3000 1000
