# TEMPORARY (#114): loops the first UIA walk of a new window on the windows runner. Removed before merge.
name: uia-probe-114
on:
  push:
    branches: [dev]
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e .[test]
      - name: probe under 8 busy processes
        run: for /L %%i in (1,1,6) do python scripts\probe_uia_114.py 8
      - name: probe under 24 busy processes
        run: for /L %%i in (1,1,6) do python scripts\probe_uia_114.py 24
